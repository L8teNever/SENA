version: '3.8'

services:
  sena:
    # Zieht das Docker-Image automatisch aus der GitHub Container Registry (GHCR).
    # ERSETZE '<github-username>' und '<repo-name>' mit deinem echten GitHub-Pfad!
    # Beispiel: ghcr.io/dein-nutzername/sena:latest
    image: ghcr.io/<github-username>/<repo-name>:latest
    container_name: sena
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=/app/data/sena.db
