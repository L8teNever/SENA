services:
  sena:
    # Zieht das Docker-Image automatisch aus der GitHub Container Registry (GHCR).
    image: ghcr.io/l8tenever/sena:latest
    container_name: sena
    restart: unless-stopped
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=/app/data/sena.db
