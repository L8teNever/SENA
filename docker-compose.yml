services:
  sena:
    # Zieht das Docker-Image automatisch aus der GitHub Container Registry (GHCR).
    image: ghcr.io/l8tenever/sena:latest
    container_name: sena
    network_mode: "bridge"
    restart: unless-stopped
    ports:
      - "10.7.0.1:1026:8000"
    volumes:
      - ./data:/app/data
    env_file:
      - .env
    environment:
      - DATABASE_URL=/app/data/sena.db
      # Falls du eine feste Weiterleitungs-URI/Domain erzwingen willst (z. B. sena.l8tenever.com):
      # - REDIRECT_URI=https://sena.l8tenever.com/oauth2callback
